<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COW PMR Findings Tracker</title>
<style>
:root{font:16px system-ui,sans-serif;color:#261639;background:#f6f3f9}
body{margin:0}header{background:#35154f;color:white;padding:40px max(24px,calc((100% - 720px)/2))}
h1{margin:0;font-size:clamp(1.65rem,5vw,2.5rem)}
main{max-width:720px;margin:28px auto;padding:0 20px}
section{background:white;border:1px solid #e4d9ec;border-radius:14px;padding:24px}
h2{margin:0 0 10px;font-size:1.25rem}
p{margin:0 0 18px;line-height:1.55}
.action{display:inline-block;padding:11px 15px;background:#552578;color:white;border-radius:8px;font-weight:650;text-decoration:none}
footer{margin-top:20px}footer a{color:#552578}
</style>
</head>
<body>
<header><h1>COW PMR Findings Tracker</h1></header>
<main>
<section aria-labelledby="regional">
<h2 id="regional">Regional findings</h2>
<p>Open <strong>PMR Monthly Finding Tracker</strong> in Google Drive, then choose your region in the Summary tab. Use your work Google account to edit mitigation dates, actions and status.</p>
<a class="action" href="https://drive.google.com/drive/u/0/search?q=PMR%20Monthly%20Finding%20Tracker">Find the tracker in Google Drive</a>
</section>
<footer><a href="https://github.com/Bannaga-Abdalmuhsin/COW-pmr-findings-tracker#web-tracker">Web tracker deployment instructions</a></footer>
</main>
</body>
</html>
